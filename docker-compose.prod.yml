services:
  # PostgreSQL 17 Database
  postgres:
    image: postgres:17-alpine
    container_name: postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amardoctor_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for Channels, Celery, and Caching
  redis:
    image: redis:7-alpine
    container_name: redis_prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amardoctor_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Django ASGI Application
  app:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: amardoctor_app_prod
    restart: always
    command: >
      bash -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn core.asgi:application \
      -k uvicorn.workers.UvicornWorker \
      --bind 0.0.0.0:8000 \
      --workers 4 \
      --worker-class uvicorn.workers.UvicornWorker \
      --timeout 60 \
      --access-logfile - \
      --error-logfile -
      "
    environment:
      - ENVIRONMENT=prod
      - DEBUG=False
      - DB_NAME=${DB_NAME:-amardoctor_prod}
      - DB_USER=${DB_USER:-amardoctor}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@amardoctor.com}
      - SSL_STORE_ID=${SSL_STORE_ID:-}
      - SSL_STORE_PASSWORD=${SSL_STORE_PASSWORD:-}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-https://localhost}
    volumes:
      - ./core/staticfiles:/app/staticfiles
      - ./core/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amardoctor_network
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Worker
  celery:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: amardoctor_celery_prod
    restart: always
    command: celery -A core worker --loglevel=info --concurrency=4 --max-tasks-per-child=1000
    environment:
      - ENVIRONMENT=prod
      - DEBUG=False
      - DB_NAME=${DB_NAME:-amardoctor_prod}
      - DB_USER=${DB_USER:-amardoctor}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@amardoctor.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amardoctor_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: amardoctor_celery_beat_prod
    restart: always
    command: celery -A core beat --loglevel=info
    environment:
      - ENVIRONMENT=prod
      - DEBUG=False
      - DB_NAME=${DB_NAME:-amardoctor_prod}
      - DB_USER=${DB_USER:-amardoctor}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@amardoctor.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amardoctor_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    restart: always
    volumes:
      - ./nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./core/staticfiles:/app/staticfiles:ro
      - ./core/media:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - amardoctor_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  amardoctor_network:
    driver: bridge
