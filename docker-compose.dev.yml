version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: amardoctor_db_dev
    environment:
      POSTGRES_DB: ${DB_NAME:-amardoctor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amardoctor_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: amardoctor_redis_dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data_dev:/data
    networks:
      - amardoctor_network

  # Django ASGI Application
  django:
    build:
      context: .
      dockerfile: docker/dev/django/Dockerfile
    container_name: amardoctor_django_dev
    command: /entrypoint.sh
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-amardoctor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      ALLOWED_HOSTS: localhost,127.0.0.1,django,nginx
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000,http://localhost:8080"
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SSL_STORE_ID: ${SSL_STORE_ID}
      SSL_STORE_PASSWORD: ${SSL_STORE_PASSWORD}
      PUBLIC_DOMAIN: "http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./core:/app/core
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amardoctor_network
    stdin_open: true
    tty: true

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: docker/dev/django/Dockerfile
    container_name: amardoctor_celery_dev
    command: celery -A core worker -l info --concurrency=4
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-amardoctor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./core:/app/core
    depends_on:
      - db
      - redis
      - django
    networks:
      - amardoctor_network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: docker/dev/django/Dockerfile
    container_name: amardoctor_celery_beat_dev
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-amardoctor}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-production}
    volumes:
      - ./core:/app/core
    depends_on:
      - db
      - redis
      - django
    networks:
      - amardoctor_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: amardoctor_nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev:/etc/nginx/conf.d:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - django
    networks:
      - amardoctor_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  amardoctor_network:
    driver: bridge
