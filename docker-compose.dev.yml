services:
  # PostgreSQL 17 Database
  postgres:
    image: postgres:17-alpine
    container_name: postgres_dev
    environment:
      POSTGRES_DB: ${DB_NAME:-amardoctor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amardoctor_network

  # Redis for Channels, Celery, and Caching
  redis:
    image: redis:7-alpine
    container_name: redis_dev
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amardoctor_network

  # Django ASGI Application
  app:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: amardoctor_app_dev
    command: >
      bash -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p 8000 core.asgi:application
      "
    environment:
      - ENVIRONMENT=dev
      - DEBUG=True
      - DB_NAME=${DB_NAME:-amardoctor}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,app}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:8000,http://localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000,http://localhost}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@amardoctor.com}
      - SSL_STORE_ID=${SSL_STORE_ID:-}
      - SSL_STORE_PASSWORD=${SSL_STORE_PASSWORD:-}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-http://localhost:8000}
    volumes:
      - ./core:/app  # Hot reload
      - ./core/staticfiles:/app/staticfiles
      - ./core/media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amardoctor_network
    profiles:
      - app

  # Celery Worker
  celery:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: amardoctor_celery_dev
    command: celery -A core worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=dev
      - DEBUG=True
      - DB_NAME=${DB_NAME:-amardoctor}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@amardoctor.com}
    volumes:
      - ./core:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amardoctor_network
    profiles:
      - worker

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: amardoctor_celery_beat_dev
    command: celery -A core beat --loglevel=info
    environment:
      - ENVIRONMENT=dev
      - DEBUG=True
      - DB_NAME=${DB_NAME:-amardoctor}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_DB=${REDIS_CACHE_DB:-1}
      - REDIS_CELERY_DB=${REDIS_CELERY_DB:-0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@amardoctor.com}
    volumes:
      - ./core:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amardoctor_network
    profiles:
      - worker

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx_dev
    volumes:
      - ./nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./core/staticfiles:/app/staticfiles:ro
      - ./core/media:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - amardoctor_network
    profiles:
      - app

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  amardoctor_network:
    driver: bridge
