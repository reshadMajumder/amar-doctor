name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch or tag) to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: core
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Django test suite
        run: python manage.py test

  frontend-builds:
    name: Frontend Builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://amardoc.reshad.dev
          NEXT_PUBLIC_SITE_URL: https://amardoc.reshad.dev
        run: npm run build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-checks
      - frontend-builds
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "DEPLOY_PATH secret is required (example: /home/deploy/Adurys-gallery)."
            exit 1
          fi

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_REF='${DEPLOY_REF}' DOCKER_BUILDKIT='1' COMPOSE_DOCKER_CLI_BUILD='1' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          echo "=== Fetching latest code ==="
          git fetch origin
          git checkout "$DEPLOY_REF"
          git pull --ff-only origin "$DEPLOY_REF"

          echo "=== Building and deploying containers ==="
          docker compose up -d --build --remove-orphans core frontend admin celery_worker celery_beat nginx

          echo "=== Waiting for services to start ==="
          sleep 5

          echo "=== Checking service status ==="
          docker compose ps

          echo "=== Validating nginx configuration ==="
          docker compose exec -T nginx nginx -t

          echo "=== Restarting nginx ==="
          docker compose restart nginx

          echo "=== Deployment completed successfully ==="
          REMOTE
